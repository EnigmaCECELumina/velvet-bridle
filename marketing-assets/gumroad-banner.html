<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Velvet Bridle - Gumroad Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1600px;
            height: 400px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            font-family: 'Cinzel', serif;
            overflow: hidden;
            position: relative;
        }

        /* Ornate frame */
        .ornate-frame {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 3px solid #c9a227;
            border-radius: 8px;
            pointer-events: none;
        }

        .ornate-frame::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 1px solid #d4af37;
            border-radius: 12px;
            opacity: 0.5;
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid #c9a227;
            opacity: 0.6;
        }

        .corner-tl {
            top: 30px;
            left: 30px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 30px;
            right: 30px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 30px;
            left: 30px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 30px;
            right: 30px;
            border-left: none;
            border-top: none;
        }

        /* Horse silhouette */
        .horse-silhouette {
            position: absolute;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
            opacity: 0.15;
            background: radial-gradient(circle, #c9a227 0%, transparent 70%);
            border-radius: 50%;
        }

        .horse-silhouette::before {
            content: '🐴';
            position: absolute;
            font-size: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
            filter: drop-shadow(0 0 20px rgba(201, 162, 39, 0.5));
        }

        /* Gold filigree lines */
        .filigree {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a227, transparent);
            opacity: 0.3;
        }

        .filigree-1 {
            top: 100px;
            left: 50px;
            right: 50px;
        }

        .filigree-2 {
            bottom: 100px;
            left: 50px;
            right: 50px;
        }

        /* Text content */
        .content {
            position: relative;
            z-index: 10;
            padding: 60px 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            font-weight: 600;
            color: #c9a227;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(201, 162, 39, 0.3);
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            color: #f5f0e8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .tagline {
            font-family: 'Lato', serif;
            font-size: 18px;
            color: #c9a227;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 20px;
            opacity: 0.8;
        }

        .feature-badges {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .badge {
            background: rgba(201, 162, 39, 0.1);
            border: 1px solid #c9a227;
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Lato', serif;
            font-size: 12px;
            color: #c9a227;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sparkle effects */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #c9a227;
            border-radius: 50%;
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .sparkle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 25%; left: 80%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 75%; left: 15%; animation-delay: 1s; }
        .sparkle:nth-child(4) { top: 85%; left: 75%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 50%; left: 90%; animation-delay: 2s; }

        /* Decorative elements */
        .decorative-line {
            position: absolute;
            bottom: 60px;
            left: 80px;
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, #c9a227, transparent);
        }

        .decorative-line::after {
            content: '✦';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #c9a227;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="ornate-frame"></div>
    
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    
    <div class="filigree filigree-1"></div>
    <div class="filigree filigree-2"></div>
    
    <div class="horse-silhouette"></div>
    
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    <div class="content">
        <h1 class="main-title">The Velvet Bridle</h1>
        <p class="subtitle">Gothic Luxury Equine Planner</p>
        
        <div class="feature-badges">
            <span class="badge">✦ Dark Elegance</span>
            <span class="badge">✦ Premium Design</span>
            <span class="badge">✦ Complete Care</span>
        </div>
        
        <p class="tagline">Where Equestrian Care Meets Gothic Excellence</p>
        
        <div class="decorative-line"></div>
    </div>
</body>
</html>
